<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Subgroups</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 id="group-title">📚 Subgroups</h1>
    <div id="subgroups-list"></div>
  </div>

  <!-- groups.js is now auto-generated by generate-groups.js from the
       actual chapter files in each group folder — don't edit it by hand. -->
  <script src="groups.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const groupKey = urlParams.get("group");
      const group = groupsData[groupKey];

      const title = document.getElementById("group-title");
      if (group) {
        title.textContent = group.display;
        const subgroupsList = document.getElementById("subgroups-list");

        const integerChapters = group.subgroups
          .filter(sub => /^\d+$/.test(sub))       // keep only plain integers, skip "Intro", "Intro1", "1.1", etc.
          .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));


        const introChapters = group.subgroups
          .filter(sub => /^Intro\d*$/.test(sub))
          .sort((a, b) => {
            const numA = a === "Intro" ? 0 : parseInt(a.replace("Intro", ""), 10);
            const numB = b === "Intro" ? 0 : parseInt(b.replace("Intro", ""), 10);
            return numA - numB;
          });

        // Convert JSON value to the existing filename:
        // "Intro"  -> "0"
        // "Intro1" -> "0.1"
        // "Intro2" -> "0.2"
        function introFilename(sub) {
          if (sub === "Intro") return "0";

          const suffix = sub.replace("Intro", "");
          return `0.${parseInt(suffix, 10)}`;
        }

        introChapters.forEach(sub => {
          const btn = document.createElement("button");
          btn.className = "list-btn";
          btn.textContent = sub;

          const filename = introFilename(sub);

          btn.onclick = () => {
            window.location.href = `${groupKey}/${filename}.html`;
          };

          subgroupsList.appendChild(btn);
        });

          
        integerChapters.forEach(sub => {
          const btn = document.createElement("button");
          btn.className = "list-btn";
          btn.textContent = "അധ്യായം " + sub;

          btn.onclick = () => {
            // go to quiz page
            window.location.href = `${groupKey}/${sub}.html`;
          };
          subgroupsList.appendChild(btn);
        });
      } else {
        title.textContent = "Group not found!";
      }
    });
  </script>
</body>
</html>
