<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Groups</title>
  <link rel="stylesheet" href="style.css" />
  <script src="groups.js"></script>
</head>
<body>
  <div class="container">
    <h1>📖 Quiz Groups</h1>

    <div style="margin-bottom:14px; display:flex; align-items:center; gap:8px;">
      <label for="chunkSizeInput">Questions per part:</label>
      <input
        type="number"
        id="chunkSizeInput"
        min="1"
        style="width:70px; padding:4px 6px; border-radius:6px; border:1px solid #ccc;"
      />
    </div>

    <div id="groups-list"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ---- configurable chunk size ----
      const chunkInput = document.getElementById("chunkSizeInput");

      const saved = parseInt(localStorage.getItem("questionsPerPart"), 10);
      chunkInput.value = (saved && saved > 0) ? saved : 30;

      // save default immediately if nothing was stored yet
      if (!saved) {
        localStorage.setItem("questionsPerPart", chunkInput.value);
      }

      chunkInput.addEventListener("change", () => {
        let val = parseInt(chunkInput.value, 10);
        if (!val || val < 1) val = 30;
        chunkInput.value = val;
        localStorage.setItem("questionsPerPart", val);
      });

      // ---- existing groups list ----
      const groupsList = document.getElementById("groups-list");
      for (const key in groupsData) {
        const group = groupsData[key];
        const btn = document.createElement("button");
        btn.className = "list-btn";
        btn.textContent = group.display;
        btn.onclick = () => {
          window.location.href = `subgroups.html?group=${key}`;
        };
        groupsList.appendChild(btn);
      }
        const btn0 = document.createElement("button");
        btn0.className = "list-btn";
        btn0.textContent = "Interactive Study";
        btn0.onclick = () => {
          window.location.href = `indexinteractive.html`;
        };

        groupsList.appendChild(btn0);

        const btn = document.createElement("button");
        btn.className = "list-btn";
        btn.textContent = "Image Study";
        btn.onclick = () => {
          window.location.href = `logos2025indeximage.html`;
        };

        groupsList.appendChild(btn);

        const btn1 = document.createElement("button");
        btn1.className = "list-btn";
        btn1.textContent = "Mock Test";
        btn1.onclick = () => {
          window.location.href = `fullquiz.html`;
        };
        groupsList.appendChild(btn1);


        const btn2 = document.createElement("button");
        btn2.className = "list-btn";
        btn2.textContent = "People Study";
        btn2.onclick = () => {
          window.location.href = `peoplestudy.html`;
        };
        groupsList.appendChild(btn2);

        const btn3 = document.createElement("button");
        btn3.className = "list-btn";
        btn3.textContent = "People";
        btn3.onclick = () => {
          window.location.href = `people.html`;
        };
        groupsList.appendChild(btn3);

    });
  </script>
</body>
</html>
