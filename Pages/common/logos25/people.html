<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ബൈബിൾ ക്വിസ്</title>
<style>
  :root{--bg:#0f172a;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8;--correct:#16a34a;--wrong:#dc2626}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans Malayalam',"Helvetica Neue",Arial;color:#e6eef6;background:linear-gradient(180deg,#071129 0%,#071827 100%);display:flex;align-items:center;justify-content:center;padding:16px}
  .container{width:100%;max-width:640px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:14px;padding:16px;box-shadow:0 10px 30px rgba(2,6,23,0.6)}
  header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:#012;flex-shrink:0}
  h1{font-size:1rem;margin:0}
  p.desc{margin:2px 0 0;color:var(--muted);font-size:0.82rem}

  .card{background:var(--card);padding:14px;border-radius:12px;margin-top:8px}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .progress{height:8px;background:rgba(255,255,255,0.04);border-radius:999px;overflow:hidden;flex:1;margin-left:10px}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);width:0%;transition:width .25s ease}
  .qnum{font-size:0.82rem;color:var(--muted);white-space:nowrap}

  .question{font-size:1.05rem;line-height:1.5;margin:6px 0 14px}

  .options{display:grid;grid-template-columns:1fr;gap:10px}
  button.opt{padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);color:inherit;font-size:0.98rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;line-height:1.4}
  button.opt:active{transform:translateY(1px)}
  button.opt .label{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem}
  button.opt:disabled{cursor:default}

  .footer{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
  button.primary{background:var(--accent);color:#022;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:0.95rem}
  button.primary:disabled{opacity:0.4;cursor:default}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.08);padding:10px 14px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:0.9rem}

  .result{padding:16px;border-radius:10px;margin-top:10px;background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));display:none;text-align:center}
  .result.show{display:block}
  .score{font-weight:700;font-size:1.4rem;margin-bottom:4px}
  .score-sub{color:var(--muted);font-size:0.88rem;margin-bottom:14px}

  .correct{border-color:rgba(34,197,94,0.4)!important;background:linear-gradient(90deg,rgba(34,197,94,0.1),rgba(34,197,94,0.03))!important}
  .wrong{border-color:rgba(220,38,38,0.4)!important;background:linear-gradient(90deg,rgba(220,38,38,0.1),rgba(220,38,38,0.03))!important}

  @media (max-width:400px){
    .question{font-size:1rem}
    button.opt{font-size:0.92rem;padding:11px 12px}
  }
</style>
</head>
<body>
  <div class="container" role="application" aria-labelledby="quiztitle">
    <header>
      <div class="logo">📖</div>
      <div>
        <h1 id="quiztitle">ബൈബിൾ ക്വിസ്</h1>
        <p class="desc">ഓരോ തവണയും ചോദ്യങ്ങളും ഉത്തരങ്ങളും ക്രമരഹിതമായി മാറും</p>
      </div>
    </header>

    <div class="card" id="quizCard">
      <div class="meta">
        <div class="qnum" id="qNumber">Question 1 / 1</div>
        <div class="progress"><span id="progressBar"></span></div>
      </div>

      <div class="question" id="questionText">...</div>
      <div class="options" id="options"></div>

      <div class="footer">
        <button class="ghost" id="prevBtn" disabled>Previous</button>
        <button class="primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>

    <div class="result" id="resultBox">
      <div class="score" id="scoreText">0 / 0</div>
      <div class="score-sub" id="scoreSub"></div>
      <button class="primary" id="restartBtn">Restart (Reshuffled)</button>
    </div>
  </div>

<script>
const RAW_QUESTIONS = [{
    "Question": "നീ ആരാണെന്ന് ചോദിക്കാൻ യഹൂദർ ജറുസലേമിൽ നിന്ന് ആരെയാണ് അയച്ചത്?",
    "A": "പരീശന്മാരെ", "B": "പുരോഹിതൻമാരെയും ലേവ്യരെയും", "C": "ശാസ്ത്രിമാരെ", "D": "സദൂക്യരെ", "Ans": "B"
  },

    "A": "പുരോഹിതന്മാർ", "B": "ശിഷ്യന്മാർ", "C": "പരീശന്മാർ", "D": "ജനക്കൂട്ടം", "Ans": "B"

    "A": "പരീശന്മാരോട്", "B": "നിക്കൊദേമോസിനോട്", "C": "ശാസ്ത്രിമാരോട്", "D": "പുരോഹിതന്മാരോട്", "Ans": "B"

// ---- DOM refs ----
const qNumber = document.getElementById('qNumber');
const progressBar = document.getElementById('progressBar');
const questionText = document.getElementById('questionText');
const optionsWrap = document.getElementById('options');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resultBox = document.getElementById('resultBox');
const scoreText = document.getElementById('scoreText');
const scoreSub = document.getElementById('scoreSub');
const restartBtn = document.getElementById('restartBtn');
const quizCard = document.getElementById('quizCard');

let QUESTIONS = [];
let current = 0;
let score = 0;
let userAnswers = [];
const total = RAW_QUESTIONS.length;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build a fresh shuffled run: question order shuffled, and each question's
// option order shuffled independently.
function buildQuiz(){
  const shuffledQuestions = shuffleArray(RAW_QUESTIONS);
  QUESTIONS = shuffledQuestions.map(q => {
    const keys = shuffleArray(['A','B','C','D']);
    return {
      Question: q.Question,
      optionText: keys.map(k => q[k]),
      correctText: q[q.Ans]    // correct answer identified by TEXT (order-independent)
    };
  });
  current = 0;
  score = 0;
  userAnswers = new Array(total).fill(null);
  quizCard.style.display = '';
  resultBox.classList.remove('show');
  nextBtn.disabled = true;
  renderQuestion(0);
}

function renderQuestion(index){
  const q = QUESTIONS[index];

  qNumber.textContent = `Question ${index+1} / ${total}`;
  const pct = Math.round((index/total)*100);
  progressBar.style.width = pct + '%';
  questionText.textContent = q.Question;

  optionsWrap.innerHTML = '';
  const labels = ['A','B','C','D'];
  q.optionText.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.dataset.idx = i;
    btn.innerHTML = `<span class="label">${labels[i]}</span><span>${text}</span>`;
    btn.addEventListener('click', onOptionClick);
    optionsWrap.appendChild(btn);
  });

  if(userAnswers[index] !== null){
    applyFeedback(index);
  }

  prevBtn.disabled = index === 0;
  nextBtn.disabled = userAnswers[index] === null;
}

function onOptionClick(e){
  const btn = e.currentTarget;
  const idx = parseInt(btn.dataset.idx, 10);
  if(userAnswers[current] !== null) return;

  const q = QUESTIONS[current];
  const chosenText = q.optionText[idx];
  userAnswers[current] = idx;

  if(chosenText === q.correctText){
    score += 1;
  }

  applyFeedback(current);
  nextBtn.disabled = false;

  if(current === total - 1){
    setTimeout(showResults, 500);
  }
}

function applyFeedback(index){
  const q = QUESTIONS[index];
  const nodes = optionsWrap.querySelectorAll('button.opt');
  const chosenIdx = userAnswers[index];
  nodes.forEach(node => {
    const i = parseInt(node.dataset.idx, 10);
    const isCorrect = q.optionText[i] === q.correctText;
    if(i === chosenIdx){
      node.classList.add(isCorrect ? 'correct' : 'wrong');
    }
    if(isCorrect){
      node.classList.add('correct');
    }
    node.disabled = true;
  });
}

function showResults(){
  progressBar.style.width = '100%';
  quizCard.style.display = 'none';
  scoreText.textContent = `${score} / ${total}`;
  const pct = Math.round((score/total)*100);
  scoreSub.textContent = `${pct}% correct`;
  resultBox.classList.add('show');
}

prevBtn.onclick = () => { if(current > 0){ current--; renderQuestion(current); } };
nextBtn.onclick = () => {
  if(current < total - 1){
    current++;
    renderQuestion(current);
  } else {
    showResults();
  }
};
restartBtn.onclick = buildQuiz;

buildQuiz();
</script>
